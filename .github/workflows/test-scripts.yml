name: Test CI Scripts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  test:
    name: Test Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run all tests
        run: |
          for test in .github/scripts/tests/test-*.sh; do
            echo "Running $test"
            bash "$test"
          done
